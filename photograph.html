<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisheye - Profil Photographe</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome via kit (conservé car déjà utilisé) -->
    <script src="https://kit.fontawesome.com/a773d24a5d.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <!-- Header avec logo et retour à l'accueil -->
        <header class="photographHeader" role="banner">
            <div class="logo">
                <a href="https://jsr029.github.io/Rakotonirina_JeanSebastien_6_18102021/" tabindex="1" aria-label="Retour à la page d'accueil Fisheye">
                    <img src="./img/logo.JPG" alt="Logo Fisheye - Page d'accueil">
                </a>
            </div>
        </header>

        <main class="global" aria-label="Page profil du photographe">
            <!-- Section profil du photographe -->
            <section id="Photograph" class="profil-section" aria-labelledby="photographer-name">
                <header class="profil" aria-labelledby="photographer-name"></header>
            </section>

            <!-- Bouton de contact (généré par JS, mais on réserve l'emplacement pour l'accessibilité) -->
            <!-- Le bouton sera inséré dynamiquement dans .profil par votre JS -->

            <!-- Tri des médias -->
            <section class="tri" aria-labelledby="tri-label">
                <label id="tri-label" for="tri-select">Trier par</label>
                <div role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-labelledby="tri-label" aria-controls="tri-list" id="tri-combobox">
                    <button type="button" aria-label="Ouvrir le menu de tri" class="tri-button" tabindex="2">
                        <span id="tri-selected">Popularité</span>
                        <i class="fas fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <ul id="tri-list" role="listbox" aria-labelledby="tri-label" class="tri-options" hidden>
                        <li role="option" data-value="popularite" id="pop" tabindex="-1">Popularité</li>
                        <li role="option" data-value="date" id="date" tabindex="-1">Date</li>
                        <li role="option" data-value="titre" id="tit" tabindex="-1">Titre</li>
                    </ul>
                </div>
            </section>

            <!-- Galerie des médias -->
            <section id="media" aria-label="Galerie des médias du photographe">
                <!-- Les médias seront insérés ici par JS -->
            </section>

            <!-- Lightbox (modale) -->
            <div id="lightBox" class="lightModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lightbox-title">
                <div class="light-modal-content">
                    <button type="button" class="closeLightBox" aria-label="Fermer la visionneuse">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <button type="button" id="precedent" class="arrow-btn" aria-label="Image précédente">
                        <span aria-hidden="true">&lt;</span>
                    </button>
                    <button type="button" id="suivant" class="arrow-btn" aria-label="Image suivante">
                        <span aria-hidden="true">&gt;</span>
                    </button>
                    <div class="videoRimg" id="slide" role="img" aria-live="polite"></div>
                    <div class="mediaDetails" aria-label="Détails du média">
                        <h2 id="lightbox-title"></h2>
                    </div>
                </div>
            </div>

            <!-- Bloc likes totaux + prix journalier -->
            <aside class="totalLikes" role="region" aria-label="Statistiques du photographe">
                <div class="likes" aria-live="polite">
                    <span class="total-likes-count"></span>
                    <i class="fas fa-heart" aria-hidden="true"></i>
                </div>
                <div class="salary" aria-label="Tarif journalier"></div>
            </aside>
        </main>
    </div>

    <script type="module" src="./js/photograph.js"></script>
</body>

</html>
